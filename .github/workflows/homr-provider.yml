name: HOMR Provider

# Builds the CPU provider image, runs the shared contract tests inside it, and
# produces an SBOM and vulnerability scan (design section 9.5).
#
# The Modal GPU provider is built by Modal rather than here, but it shares the
# whole `services/homr-provider` package with this image, so the contract tests
# and the dependency inventory cover both. Only the CUDA base layer and the
# `gpu` extra are unique to Modal and unscanned by this workflow.

on:
  push:
    branches: ["main", "feature/scanner"]
    paths:
      - "services/homr-provider/**"
      - "services/homr-cpu/**"
      - "services/homr-modal/**"
      - ".github/workflows/homr-provider.yml"
  pull_request:
    paths:
      - "services/homr-provider/**"
      - "services/homr-cpu/**"
      - "services/homr-modal/**"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  contract-tests:
    name: Build image and run contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free runner disk space
        # The image carries HOMR plus its baked model weights.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CPU provider image
        uses: docker/build-push-action@v5
        with:
          context: ./services
          file: ./services/homr-cpu/Dockerfile
          push: false
          load: true
          tags: ots-homr-cpu:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run provider contract tests
        run: |
          docker run --rm ots-homr-cpu:ci \
            python -m unittest test_homr_provider -v

      - name: Verify readiness reports the pinned revision and licences
        # Readiness needs a warm-up inference, so this asserts the disclosure
        # surface rather than waiting for models to load.
        run: |
          docker run --rm -d --name homr-ci -p 8000:8000 ots-homr-cpu:ci
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/v1/capabilities | tee /tmp/capabilities.json
          docker rm -f homr-ci
          python - <<'PY'
          import json, sys
          data = json.load(open("/tmp/capabilities.json"))
          expected = "1ddc6fcc26c4baa746eaffbba7f5e01429063465"
          assert data["homrRevision"] == expected, data["homrRevision"]
          assert data["providerLicense"] == "AGPL-3.0-or-later", data
          assert data["homrLicense"] == "AGPL-3.0", data
          assert expected in data["source"], data["source"]
          print("capabilities disclosure OK")
          PY

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ots-homr-cpu:ci
          format: spdx-json
          artifact-name: homr-provider-sbom.spdx.json
          output-file: /tmp/homr-provider-sbom.spdx.json

      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ots-homr-cpu:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        # Upload findings even when an earlier step failed, but not when the
        # scan itself failed to write the file: uploading a missing SARIF fails
        # the job again and buries the error that actually mattered.
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif
          category: homr-provider
