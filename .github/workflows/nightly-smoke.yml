name: Nightly smoke

# The Playwright smoke suite against the application stack, on Chromium, Firefox
# and WebKit. Specs gated on scanner/IMSLP environment variables skip themselves.
on:
  schedule:
    - cron: '30 9 * * *' # 02:30 in Vancouver (PDT), after OTS_Web's browser run
  # Exercise changes to the smoke workflow itself immediately, rather than
  # waiting until the next scheduled run to discover a broken stack setup.
  push:
    branches: [main]
    paths:
      - '.github/workflows/nightly-smoke.yml'
      - 'smoke/utils/wait.cjs'
      - 'smoke/utils/seed-ci.cjs'
      - 'smoke/utils/check-abc-conversion.cjs'
      - 'smoke/e2e/viewers-diff-watch.spec.cjs'
      - 'smoke/e2e/admin-verification.spec.cjs'
      - 'smoke/e2e/branch-approvals.spec.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    # The original image was withdrawn. Use the maintained MinIO fork for this
    # disposable CI stack; existing deployments can select their own image.
    env:
      MINIO_IMAGE: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    defaults:
      run:
        working-directory: OurTextScores
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      # Hosted runners include large SDKs that this Linux/Node smoke stack does
      # not use. Leave room for Docker images, editor setup and browser traces.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v4
        with:
          path: OurTextScores
      # Compose mounts ../OTS_Web into the score-editor API container. Keep this
      # revision aligned with the vendored static editor; LFS supplies its engine.
      - name: Checkout score-editor API source
        uses: actions/checkout@v4
        with:
          repository: OurTextScores/OTS_WebEditor
          ref: c8bed9815083239b933f0ba4158723548949ba58 # v3.3.0
          path: OTS_Web
          lfs: true
      # The conversion API uses these scripts through Compose's read-only mount.
      - name: Checkout ABC conversion tools
        uses: actions/checkout@v4
        with:
          repository: ElectricAlexis/NotaGen
          ref: 4553cd743b6b449732baf2a6cc58885fe853b11d
          path: NotaGen
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Root node_modules (Playwright) is partly tracked; npm ci makes it complete.
      - run: npm ci
      # Smoke specs import frontend and backend packages on the runner; Docker's
      # builds install those dependencies inside the images only.
      - run: npm ci --prefix frontend
      - run: npm ci --prefix backend
      # Development defaults only; .env.example holds no real secrets.
      - name: Environment
        run: cp .env.example .env
      - name: Verify editor source matches the vendored engine
        run: |
          test -f ../OTS_Web/package.json
          test -f ../NotaGen/data/abc2xml.py
          test -f ../NotaGen/data/xml2abc.py
          cmp ../OTS_Web/public/webmscore.lib.wasm frontend/public/score-editor/webmscore.lib.wasm
          cmp ../OTS_Web/public/webmscore.lib.data frontend/public/score-editor/webmscore.lib.data
      - name: Verify smoke test discovery
        run: npx playwright test -c smoke/playwright.config.cjs --list
      - name: Stack
        run: |
          docker compose build backend frontend
          # This suite does not exercise MusicVAE. Starting only frontend and
          # its dependencies avoids building its multi-GB TensorFlow image.
          docker compose up -d frontend
          node smoke/utils/wait.cjs
          df -h /
      - name: Verify ABC conversion
        run: node smoke/utils/check-abc-conversion.cjs
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Seed smoke-test work
        run: node smoke/utils/seed-ci.cjs
      - name: Smoke (${{ matrix.browser }})
        run: npx playwright test -c smoke/playwright.config.cjs --project=${{ matrix.browser }}
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail=300 > compose.log
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.browser }}
          path: |
            OurTextScores/test-results/
            OurTextScores/compose.log
          retention-days: 7
      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans
