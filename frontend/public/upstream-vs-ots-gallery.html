<!doctype html><meta charset="utf-8"><title>HOMR and OTS-HOMR on the same pages</title><style>body{margin:0;font:15px system-ui}.case{border:1px solid #d8dfda;margin:18px 0;padding:14px}.head{display:flex;justify-content:space-between;gap:1rem;align-items:center}.scan{max-height:300px;max-width:100%;display:block;margin:10px auto;border:1px solid #ddd}iframe{width:100%;height:500px;border:1px solid #ddd}small{color:#59615e}table{border-collapse:collapse;margin:8px 0}td,th{border:1px solid #d8dfda;padding:3px 9px;text-align:right}th:first-child,td:first-child{text-align:left}@media(max-width:700px){iframe{height:330px}}</style><body><div id=app></div><script src="lazy-score-editor.js"></script><script>
const esc=encodeURIComponent,q='devs-assets/ots-homr-pages';
const pct=x=>(x*100).toFixed(1)+'%';
async function run(){const m=await fetch(q+'/manifest.json',{cache:'no-store'}).then(x=>x.json()),s=m.summary;
let h=`<p><small>Whole pages of clean vocal-and-piano engravings (OpenScore Lieder), none used in any development step, read by HOMR (${s.upstreamCommit}) and by OTS-HOMR, each from the same page image. Both are compared with the encoded score the page was engraved from, by pitch and duration of each note and rest, measure by measure (1.0 = identical). Chord tones beyond the first, beams, ties, slurs and text are not scored, so this is a coarse yardstick.</small></p>
<p><b>${s.musicPages} music pages:</b> the two readings score the same on ${s.within} (identical scores on ${s.identicalScore}); OTS-HOMR scores higher on ${s.oursBetter}; HOMR higher on ${s.upstreamBetter}. Mean ${(s.meanOurs).toFixed(3)} for OTS-HOMR, ${(s.meanUpstream).toFixed(3)} for HOMR. Clean modern engravings are the easy case for both; this does not show how they compare on dense or poor scans. ${s.nonMusicExcluded.length} of the ${s.pagesScanned} pages scanned were covers or illustrations and are left out.</p>
<p><small>Shown below: every page where the two differ by more than 0.02 (${s.oursBetter+s.upstreamBetter} pages). Load a comparison to page through it: HOMR on the left, OTS-HOMR on the right.</small></p>`;
for(const x of m.cases){const l=x.left?`&compareLeft=${esc('/'+q+'/'+x.left)}`:'';
h+=`<section class=case><div class=head><b>${x.id}: HOMR ${x.upstream===null?'could not read':pct(x.upstream)} · OTS-HOMR ${pct(x.ours)}</b></div><img class=scan src="${q}/${x.image}" alt="scan"><iframe data-score-editor="score-editor/index.html?${l.slice(1)}&compareRight=${esc('/'+q+'/'+x.right)}&leftLabel=HOMR&rightLabel=OTS-HOMR"></iframe></section>`}
document.querySelector('#app').innerHTML=h;installLazyScoreEditors(document.querySelector('#app'))}run();
</script>
