<!doctype html><meta charset="utf-8"><title>HOMR and OTS-HOMR on the same pages</title><body><div id=app></div><script src="overlay-view.js"></script><script>
const pct=x=>(x*100).toFixed(1)+'%';
renderOverlay(document.querySelector('#app'),'engines',data=>{const s=data.summary,n=document.createElement('div');
n.innerHTML=`<p><small>Whole pages of clean vocal-and-piano engravings (OpenScore Lieder), none used in any development step, read by HOMR (${s.upstreamCommit}) and by OTS-HOMR from the same page image. Each line of the page is shown as the scan, then HOMR, then OTS-HOMR, with the differences between the two readings boxed. Beaming is compared as drawn: HOMR leaves it to the editor's default, OTS-HOMR writes it out. Click a count to hide that kind of difference, Enlarge to see a line at full width, or open it in the editor. Dashed outlines mark a measure where the differences could not be pinned to single notes.</small></p>
