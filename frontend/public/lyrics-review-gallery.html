<!doctype html><meta charset="utf-8"><title>Lyrics and staff text, before and after review</title><style>body{margin:0;font:15px system-ui}.case{border:1px solid #d8dfda;margin:18px 0;padding:14px}.head{display:flex;justify-content:space-between;gap:1rem;align-items:center}.scan{max-height:300px;max-width:100%;display:block;margin:10px auto;border:1px solid #ddd}iframe{width:100%;height:500px;border:1px solid #ddd}small{color:#59615e}@media(max-width:700px){iframe{height:330px}}</style><body><div id=app></div><script src="lazy-score-editor.js"></script><script>
const esc=encodeURIComponent,q='devs-assets/ots-homr-lyrics';
async function run(){const m=await fetch(q+'/manifest.json',{cache:'no-store'}).then(x=>x.json()),s=m.summary;
let h=`<p>After a page is scanned, OTS-HOMR suggests the lyrics, written directions and dynamic marks it found, each tied to a note, for you to review. Left: the scan result. Right: the same page with <b>every suggestion accepted exactly as offered</b>, with no corrections, which is the worst case for a reviewer who clicks "accept all".</p>
<p><small>${s.pagesWithSuggestions} clean vocal-and-piano pages (OpenScore Lieder), none used in any development step. Accepting everything added ${s.lyricsAdded} lyric syllables, ${s.wordsAdded} written directions and ${s.dynamicsAdded} dynamic marks. Some suggestions are wrong or sit on the wrong note, and marks the scanner did not find are not there: against the encoded scores, about half of the printed directions on a page are found, and roughly two in three of those sit in the right measure. Pages below are the first ${m.cases.length} by a fixed hash order among pages that gained lyrics and at least one direction or dynamic. Load a comparison to page through it.</small></p>`;
for(const x of m.cases){h+=`<section class=case><div class=head><b>${x.id}: +${x.lyricsAdded} lyric syllables, +${x.wordsAdded} written directions, +${x.dynamicsAdded} dynamics</b></div><img class=scan src="${q}/${x.image}" alt="scan"><iframe data-score-editor="score-editor/index.html?compareLeft=${esc('/'+q+'/'+x.left)}&compareRight=${esc('/'+q+'/'+x.right)}&leftLabel=Scan%20result&rightLabel=All%20suggestions%20accepted"></iframe></section>`}
document.querySelector('#app').innerHTML=h;installLazyScoreEditors(document.querySelector('#app'))}run();
</script>
