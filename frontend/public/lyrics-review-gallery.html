<!doctype html><meta charset="utf-8"><title>Lyrics and staff text, before and after review</title><body><div id=app></div><script src="overlay-view.js"></script><script>
renderOverlay(document.querySelector('#app'),'review',data=>{const s=data.summary,n=document.createElement('div');
n.innerHTML=`<p>After a page is scanned, OTS-HOMR suggests the lyrics, written directions and dynamic marks it found, each tied to a note, for you to review. Each line of the page is shown as the scan, then the scan result, then the same line with <b>every suggestion accepted exactly as offered</b>, with no corrections, which is the worst case for a reviewer who clicks "accept all". Boxes mark what was added: <span style="white-space:nowrap"><i style="display:inline-block;width:22px;height:14px;border-radius:3px;border:2px solid #188038;background:rgba(24,128,56,.18);vertical-align:-2px"></i> green, a note that gained a lyric syllable</span>; <span style="white-space:nowrap"><i style="display:inline-block;width:22px;height:14px;border-radius:3px;border:2px solid #e37400;background:rgba(227,116,0,.18);vertical-align:-2px"></i> amber, a note that gained a written direction or dynamic mark</span>. Click a count under a title to hide that kind of box.</p>
<p><small>${s.pagesWithSuggestions} clean vocal-and-piano pages (OpenScore Lieder) from songs OTS-HOMR was not trained on. Accepting everything added ${s.lyricsAdded} lyric syllables, ${s.wordsAdded} written directions and ${s.dynamicsAdded} dynamic marks. Some suggestions are wrong or sit on the wrong note, and marks the scanner did not find are not there: against the encoded scores, about half of the printed directions on a page are found, and roughly two in three of those sit in the right measure. Pages below are six picked by a fixed hash order from the pages that gained lyrics and at least one direction or dynamic, not chosen by us for how they look.</small></p>`;return n},['Scan result','All suggestions accepted'])
</script>
