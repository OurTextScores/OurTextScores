<!doctype html><meta charset="utf-8"><style>body{margin:0;font:15px system-ui}.case{border:1px solid #d8dfda;margin:18px 0;padding:14px}.head{display:flex;justify-content:space-between;gap:1rem;align-items:center}.scan{max-height:240px;max-width:100%;display:block;margin:10px auto;border:1px solid #ddd}iframe{width:100%;height:500px;border:1px solid #ddd}label{font-weight:600;background:#edf3ef;padding:.5rem .7rem;border-radius:4px}.note{color:#52605a}</style><body><p class="note">Regenerated from the deployed rareNum ONNX core and its matched exported structured-head sidecar. Each pair decodes the crop once; the left control clears only the attached structured notation before MusicXML export. These are integration demonstrations, not a reference-accuracy ranking.</p><script>const xs=[['sq8075304_0010_0003_1',111]],q='devs-assets/beams/';for(const [id,n] of xs)document.write(`<section class=case><div class=head><b>${id}: ${n} emitted beam elements</b><label><input type=checkbox data-k="homr-keep-beam-${id}"> keep this example</label></div><img class=scan src="${q}${id}.png"><iframe src="score-editor/index.html?compareLeft=%2Fdevs-assets%2Fbeams%2F${id}__without.musicxml&compareRight=%2Fdevs-assets%2Fbeams%2F${id}__with.musicxml&leftLabel=Same%20decode%2C%20without%20sidecar&rightLabel=Same%20decode%2C%20with%20sidecar"></iframe></section>`);for(const c of document.querySelectorAll('input[data-k]')){c.checked=localStorage.getItem(c.dataset.k)==='1';c.onchange=()=>localStorage.setItem(c.dataset.k,c.checked?'1':'0')}</script>
