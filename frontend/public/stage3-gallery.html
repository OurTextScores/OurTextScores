<!doctype html><meta charset="utf-8"><style>body{margin:0;font:15px/1.45 system-ui;color:#19201d}.case{border:1px solid #d8dfda;margin:18px 0;padding:14px}.head{display:flex;justify-content:space-between;gap:1rem;align-items:center}.figure{display:block;width:100%;border:1px solid #ddd;margin-top:10px}label{font-weight:600;background:#edf3ef;padding:.5rem .7rem;border-radius:4px}.small{color:#52605a}@media(max-width:700px){.head{align-items:flex-start;flex-direction:column}}</style><body><p>Full-page predictions ranked by the sum of per-page F1 gains for Lyrics and Dynamic. Each image is, from left: scan, prior detector, current detector, and target. Green is Lyrics; blue is Dynamic. Predictions were made at native page resolution; only this display is scaled down.</p><script>const xs=[['stage3_1.jpg','6499366 p2 s3','+27.0 pp Lyrics; +97.5 pp Dynamic'],['stage3_3.jpg','6641170 p2 s4','+10.4 pp Lyrics; +98.2 pp Dynamic']];for(const [file,id,delta] of xs)document.write(`<section class=case><div class=head><div><b>${id}</b><div class=small>${delta}</div></div><label><input type=checkbox data-k="homr-keep-stage3-${file}"> keep this example</label></div><img class=figure src="devs-assets/stage3/${file}" alt="${id}: scan, previous detector, current detector, target"></section>`);for(const c of document.querySelectorAll('input[data-k]')){c.checked=localStorage.getItem(c.dataset.k)==='1';c.onchange=()=>localStorage.setItem(c.dataset.k,c.checked?'1':'0')}</script>
