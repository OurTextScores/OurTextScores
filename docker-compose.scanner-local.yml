services:
  frontend:
    build:
      args:
        NEXT_PUBLIC_SCANNER_ENABLED: "true"
    environment:
      SCANNER_ENABLED: "true"
      NEXT_PUBLIC_SCANNER_ENABLED: "true"

  backend:
    environment:
      SCANNER_ENABLED: "true"
      SCANNER_BETA_USER_IDS: "*"
      SCANNER_WORKER_ENABLED: "false"
      SCANNER_PROVIDER_KIND: local
      SCANNER_PROVIDER_URL: http://homr_cpu:8000
      SCANNER_PROVIDER_TOKEN: ${HOMR_LOCAL_PROVIDER_TOKEN:-ots-local-development}
      SCANNER_EXPECTED_HOMR_COMMIT: 1ddc6fcc26c4baa746eaffbba7f5e01429063465
      SCANNER_EXPECTED_PROVIDER_REVISION: ots-homr-cpu-v1
      SCANNER_EXPECTED_EXECUTION_PROVIDER: CPUExecutionProvider

  scanner_worker:
    depends_on:
      homr_cpu:
        condition: service_healthy
      minio:
        condition: service_started
      mongo:
        condition: service_started
    environment:
      SCANNER_ENABLED: "true"
      SCANNER_PROVIDER_KIND: local
      SCANNER_PROVIDER_URL: http://homr_cpu:8000
      SCANNER_PROVIDER_TOKEN: ${HOMR_LOCAL_PROVIDER_TOKEN:-ots-local-development}
      SCANNER_PROVIDER_TIMEOUT_MS: ${HOMR_LOCAL_REQUEST_TIMEOUT_MS:-1860000}
      SCANNER_EXPECTED_HOMR_COMMIT: 1ddc6fcc26c4baa746eaffbba7f5e01429063465
      SCANNER_EXPECTED_PROVIDER_REVISION: ots-homr-cpu-v1
      SCANNER_EXPECTED_EXECUTION_PROVIDER: CPUExecutionProvider

  homr_cpu:
    profiles: ["scanner-local"]
    build:
      # The shared homr-provider package lives beside this provider, so the
      # context is ./services rather than ./services/homr-cpu.
      context: ./services
      dockerfile: homr-cpu/Dockerfile
      args:
        HOMR_COMMIT: 1ddc6fcc26c4baa746eaffbba7f5e01429063465
    container_name: ourtextscores_homr_cpu
    restart: unless-stopped
    cpus: ${HOMR_LOCAL_CPUS:-4.0}
    mem_limit: ${HOMR_LOCAL_MEMORY_LIMIT:-8g}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=2g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOMR_COMMIT: 1ddc6fcc26c4baa746eaffbba7f5e01429063465
      HOMR_SERVICE_REVISION: ots-homr-cpu-v1
      HOMR_PROVIDER_TOKEN: ${HOMR_LOCAL_PROVIDER_TOKEN:-ots-local-development}
      # Ready wait + process timeout must stay below the worker's
      # SCANNER_PROVIDER_TIMEOUT_MS above, so the provider aborts first and
      # never orphans a run the caller has abandoned.
      HOMR_READY_WAIT_SECONDS: ${HOMR_LOCAL_READY_WAIT_SECONDS:-300}
      HOMR_PROCESS_TIMEOUT_SECONDS: ${HOMR_LOCAL_PROCESS_TIMEOUT_SECONDS:-1500}
      HOMR_IDEMPOTENCY_CACHE_SIZE: ${HOMR_LOCAL_IDEMPOTENCY_CACHE_SIZE:-16}
    ports:
      - "127.0.0.1:${HOMR_LOCAL_PORT:-8010}:8000"
    networks:
      - appnet
