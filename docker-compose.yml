services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_SCORE_EDITOR_URL: ${NEXT_PUBLIC_SCORE_EDITOR_URL:-http://localhost:3000/score-editor}
        SCORE_EDITOR_API_ORIGIN: ${SCORE_EDITOR_API_ORIGIN:-http://score_editor_api:3000}
        NEXT_PUBLIC_SCANNER_ENABLED: ${NEXT_PUBLIC_SCANNER_ENABLED:-false}
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - INTERNAL_API_URL=http://backend:4000/api
      # Runtime secret injected by the score-editor music proxy as x-ots-api-token.
      # Must match OTS_API_AUTH_TOKEN on the score_editor_api service.
      - SCORE_EDITOR_API_TOKEN=${SCORE_EDITOR_API_TOKEN:-}
      - SCANNER_ENABLED=${SCANNER_ENABLED:-false}
      - NEXT_PUBLIC_SCANNER_ENABLED=${NEXT_PUBLIC_SCANNER_ENABLED:-false}
    container_name: ourtextscores_frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
      - score_editor_api
    networks:
      - appnet

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ourtextscores_backend
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      # Optional email server for NextAuth + notifications
      EMAIL_SERVER: ${EMAIL_SERVER:-smtp://mailpit:1025}
      # For heavy scores, allow MuseScore exports to run without hard timeout in local dev.
      MUSESCORE_EXPORT_TIMEOUT_MS: ${MUSESCORE_EXPORT_TIMEOUT_MS:-0}
      MUSESCORE_WRAPPER_TIMEOUT_SECONDS: ${MUSESCORE_WRAPPER_TIMEOUT_SECONDS:-0}
      # PDF can be generated later so upload requests are not blocked by this step.
      MUSESCORE_PDF_MODE: ${MUSESCORE_PDF_MODE:-async}
      # Humdrum/Kern (.krn) converter wrapper; converts to MusicXML for editor/viewers.
      KERN_CONVERTER_CLI: ${KERN_CONVERTER_CLI:-krn2musicxml}
      KERN_CONVERTER_TIMEOUT_MS: ${KERN_CONVERTER_TIMEOUT_MS:-60000}
      # Maintenance switch: disable only IMSLP refresh rate limit when true.
      DISABLE_IMSLP_REFRESH_RATE_LIMIT: ${DISABLE_IMSLP_REFRESH_RATE_LIMIT:-false}
      # Disable upload rate limiting for bulk imports (comma-separated rule names).
      RATE_LIMIT_DISABLED_RULES: ${RATE_LIMIT_DISABLED_RULES:-}
      # OpenTelemetry (optional)
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-ourtextscores-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      # Scanner stays off unless explicitly enabled and allowlisted.
      SCANNER_ENABLED: ${SCANNER_ENABLED:-false}
      SCANNER_BETA_USER_IDS: ${SCANNER_BETA_USER_IDS:-}
      # API containers never consume GPU jobs; the profile-gated worker below does.
      SCANNER_WORKER_ENABLED: "false"
      SCANNER_PROVIDER_KIND: ${SCANNER_PROVIDER_KIND:-modal}
      SCANNER_PROVIDER_URL: ${SCANNER_PROVIDER_URL:-}
      SCANNER_PROVIDER_TOKEN: ${SCANNER_PROVIDER_TOKEN:-}
      SCANNER_MODAL_TOKEN_ID: ${SCANNER_MODAL_TOKEN_ID:-}
      SCANNER_MODAL_TOKEN_SECRET: ${SCANNER_MODAL_TOKEN_SECRET:-}
      SCANNER_PROVIDER_BUDGET_EXHAUSTED: ${SCANNER_PROVIDER_BUDGET_EXHAUSTED:-false}
      SCANNER_EXPECTED_HOMR_COMMIT: ${SCANNER_EXPECTED_HOMR_COMMIT:-1ddc6fcc26c4baa746eaffbba7f5e01429063465}
      SCANNER_EXPECTED_PROVIDER_REVISION: ${SCANNER_EXPECTED_PROVIDER_REVISION:-ots-homr-modal-v2}
      SCANNER_EXPECTED_PROVIDER_SOURCE_COMMIT: ${SCANNER_EXPECTED_PROVIDER_SOURCE_COMMIT:-}
      SCANNER_EXPECTED_EXECUTION_PROVIDER: ${SCANNER_EXPECTED_EXECUTION_PROVIDER:-CUDAExecutionProvider}
      SCANNER_MAX_UPLOAD_BYTES: ${SCANNER_MAX_UPLOAD_BYTES:-26214400}
      SCANNER_MAX_PAGES: ${SCANNER_MAX_PAGES:-20}
      SCANNER_MAX_IMAGE_DIMENSION: ${SCANNER_MAX_IMAGE_DIMENSION:-12000}
      SCANNER_MAX_IMAGE_PIXELS: ${SCANNER_MAX_IMAGE_PIXELS:-80000000}
      SCANNER_MAX_IMAGE_ASPECT_RATIO: ${SCANNER_MAX_IMAGE_ASPECT_RATIO:-20}
      SCANNER_MAX_MUSICXML_BYTES: ${SCANNER_MAX_MUSICXML_BYTES:-10485760}
      SCANNER_MAX_ACTIVE_JOBS_PER_USER: ${SCANNER_MAX_ACTIVE_JOBS_PER_USER:-2}
      SCANNER_ROLLING_24H_PAGE_QUOTA: ${SCANNER_ROLLING_24H_PAGE_QUOTA:-50}
      SCANNER_MAX_MANUAL_RETRIES: ${SCANNER_MAX_MANUAL_RETRIES:-1}
      SCANNER_PROVIDER_TIMEOUT_MS: ${SCANNER_PROVIDER_TIMEOUT_MS:-600000}
      SCANNER_TERMINAL_NOTIFICATIONS_ENABLED: ${SCANNER_TERMINAL_NOTIFICATIONS_ENABLED:-true}
      SCANNER_SOURCE_RETENTION_DAYS: ${SCANNER_SOURCE_RETENTION_DAYS:-7}
      SCANNER_RESULT_RETENTION_DAYS: ${SCANNER_RESULT_RETENTION_DAYS:-30}
    depends_on:
      - mongo
      - meili
      - minio
      - mailpit
    volumes:
      - ../fossil_data:/data/fossil_data
    networks:
      - appnet

  scanner_worker:
    profiles: ["scanner", "scanner-local"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ourtextscores_scanner_worker
    command: ["node", "dist/scanner-worker.main.js"]
    restart: unless-stopped
    # Keep CPU-side rasterization/rendering from competing with the public API.
    cpus: ${SCANNER_WORKER_CPUS:-1.0}
    cpu_shares: 256
    mem_limit: ${SCANNER_WORKER_MEMORY_LIMIT:-2g}
    env_file:
      - .env
    environment:
      SCANNER_WORKER_ENABLED: "true"
      MUSESCORE_EXPORT_TIMEOUT_MS: ${SCANNER_RENDER_TIMEOUT_MS:-300000}
      MUSESCORE_WRAPPER_TIMEOUT_SECONDS: ${SCANNER_RENDER_WRAPPER_TIMEOUT_SECONDS:-300}
      # The API process owns inbox/outbox email polling; this process only writes
      # deduplicated Scanner terminal notifications.
      NOTIFICATIONS_PROCESSOR_ENABLED: "false"
    depends_on:
      - mongo
      - minio
    networks:
      - appnet

  score_editor_api:
    image: node:20-bookworm
    container_name: ourtextscores_score_editor_api
    working_dir: /app
    command:
      - sh
      - -lc
      - |
        set -eu
        apt-get update
        apt-get install -y --no-install-recommends python3 python3-pip python3-pyparsing musescore3 mma xvfb xauth libopengl0 libpipewire-0.3-0 ca-certificates curl
        python3 -c "import music21" >/dev/null 2>&1 || python3 -m pip install --break-system-packages --no-cache-dir "music21>=9,!=9.9.2,<10"
        # MuseScore 4 is cached in the musescore4_opt volume, so it is downloaded
        # and extracted only once (not on every container recreate).
        if [ ! -x /opt/musescore4/bin/mscore4portable ] && [ -n "$$MUSESCORE4_APPIMAGE_URL" ]; then
          echo "Installing MuseScore 4 from AppImage: $$MUSESCORE4_APPIMAGE_URL"
          if curl -fL --retry 3 --retry-delay 2 --retry-all-errors "$$MUSESCORE4_APPIMAGE_URL" -o /tmp/MuseScore-4.AppImage; then
            chmod +x /tmp/MuseScore-4.AppImage
            if ( cd /tmp && /tmp/MuseScore-4.AppImage --appimage-extract ); then
              mkdir -p /opt/musescore4
              cp -a /tmp/squashfs-root/. /opt/musescore4/
            else
              echo "WARNING: MuseScore 4 AppImage extraction failed; continuing with musescore3 fallback." >&2
            fi
          else
            echo "WARNING: Failed to download MuseScore 4 AppImage; continuing with musescore3 fallback." >&2
          fi
          rm -f /tmp/MuseScore-4.AppImage
          rm -rf /tmp/squashfs-root
        fi
        # (Re)create the wrapper each boot; /usr/local/bin is not persisted.
        if [ -x /opt/musescore4/bin/mscore4portable ]; then
          echo '#!/bin/sh' > /usr/local/bin/musescore4
          echo 'TIMEOUT_SECONDS="$${MUSESCORE_WRAPPER_TIMEOUT_SECONDS:-300}"' >> /usr/local/bin/musescore4
          echo 'XVFB_ARGS="-screen 0 640x480x24 -ac +extension GLX +render -noreset"' >> /usr/local/bin/musescore4
          echo 'if [ "$${TIMEOUT_SECONDS}" = "0" ]; then' >> /usr/local/bin/musescore4
          echo '  exec xvfb-run -a -s "$${XVFB_ARGS}" /opt/musescore4/bin/mscore4portable "$$@"' >> /usr/local/bin/musescore4
          echo 'fi' >> /usr/local/bin/musescore4
          echo 'exec timeout "$${TIMEOUT_SECONDS}" xvfb-run -a -s "$${XVFB_ARGS}" /opt/musescore4/bin/mscore4portable "$$@"' >> /usr/local/bin/musescore4
          chmod +x /usr/local/bin/musescore4
        fi
        npm install
        npm run dev -- --hostname 0.0.0.0 --port 3000
    environment:
      BUILD_MODE: ${BUILD_MODE:-}
      NEXT_PUBLIC_BUILD_MODE: ${NEXT_PUBLIC_BUILD_MODE:-}
      MUSIC_XML2ABC_SCRIPT: ${MUSIC_XML2ABC_SCRIPT:-/opt/notagen/data/xml2abc.py}
      MUSIC_ABC2XML_SCRIPT: ${MUSIC_ABC2XML_SCRIPT:-/opt/notagen/data/abc2xml.py}
      MUSESCORE4_APPIMAGE_URL: ${MUSESCORE4_APPIMAGE_URL:-https://github.com/musescore/MuseScore/releases/download/v4.6.3/MuseScore-Studio-4.6.3.252940956-x86_64.AppImage}
      MUSESCORE_WRAPPER_TIMEOUT_SECONDS: ${MUSESCORE_WRAPPER_TIMEOUT_SECONDS:-300}
      MUSIC_MUSESCORE_TIMEOUT_MS: ${MUSIC_MUSESCORE_TIMEOUT_MS:-120000}
      MUSIC_MUSESCORE_BIN: ${MUSIC_MUSESCORE_BIN:-musescore4}
      MUSIC_MUSESCORE_BIN_CANDIDATES: ${MUSIC_MUSESCORE_BIN_CANDIDATES:-musescore4,mscore4portable,musescore3,musescore}
      MUSIC_MUSESCORE_USE_XVFB: ${MUSIC_MUSESCORE_USE_XVFB:-true}
      MUSIC_MMA_BIN: ${MUSIC_MMA_BIN:-mma}
      MUSIC_MMA_BIN_CANDIDATES: ${MUSIC_MMA_BIN_CANDIDATES:-mma}
      MUSIC_MMA_TIMEOUT_MS: ${MUSIC_MMA_TIMEOUT_MS:-60000}
      MUSIC_MMA_MAX_SCRIPT_BYTES: ${MUSIC_MMA_MAX_SCRIPT_BYTES:-262144}
      MUSIC_MMA_MAX_STDERR_CHARS: ${MUSIC_MMA_MAX_STDERR_CHARS:-8000}
      MUSIC_HARMONY_PYTHON: ${MUSIC_HARMONY_PYTHON:-python3}
      MUSIC_HARMONY_SCRIPT: ${MUSIC_HARMONY_SCRIPT:-/app/tools/music21_harmony/analyze_harmony.py}
      MUSIC_HARMONY_TIMEOUT_MS: ${MUSIC_HARMONY_TIMEOUT_MS:-180000}
      MUSIC_KERN_MUSICXML_SCRIPT: ${MUSIC_KERN_MUSICXML_SCRIPT:-/app/tools/kern_conversion/convert_kern_musicxml.py}
      MUSIC_KERN_MUSICXML_TIMEOUT_MS: ${MUSIC_KERN_MUSICXML_TIMEOUT_MS:-60000}
      MUSIC_TRANSCODA_SPACE_ID: ${MUSIC_TRANSCODA_SPACE_ID:-jhlusko/transcoda}
      MUSIC_TRANSCODA_SPACE_TOKEN: ${MUSIC_TRANSCODA_SPACE_TOKEN:-}
      MUSIC_TRANSCODA_MODEL_ID: ${MUSIC_TRANSCODA_MODEL_ID:-btrkeks/transcoda-59M-zeroshot-v1}
      MUSIC_TRANSCODA_REVISION: ${MUSIC_TRANSCODA_REVISION:-b529f8aa5d996d9224df3395b5b92d0867343c91}
      MUSIC_TRANSCODA_TIMEOUT_MS: ${MUSIC_TRANSCODA_TIMEOUT_MS:-300000}
      MUSIC_NOTAGEN_SPACE_TOKEN: ${MUSIC_NOTAGEN_SPACE_TOKEN:-}
      MUSIC_NOTAGEN_DEFAULT_SPACE_ID: ${MUSIC_NOTAGEN_DEFAULT_SPACE_ID:-jhlusko/NotaGen-Space}
      # Self-hosted Multitrack MusicVAE service (reached by service name on the app network).
      MUSIC_MULTITRACK_VAE_SERVICE_URL: ${MUSIC_MULTITRACK_VAE_SERVICE_URL:-http://musicvae:7860}
      # API auth hardening (OTS_Web): server-credential routes (OMR, NotaGen space)
      # require ALLOW_SERVER_LLM_KEYS=1 AND a matching OTS_API_AUTH_TOKEN. When a
      # server HF token is configured above, SCORE_EDITOR_API_TOKEN MUST be set (and
      # match the frontend) or those routes return 403/401. The frontend proxies both
      # music and llm routes with this token injected, so the /api/llm/* relay is NOT
      # left open (the editor API is publicly reachable). Keep the flag at 0.
      ALLOW_SERVER_LLM_KEYS: ${ALLOW_SERVER_LLM_KEYS:-1}
      OTS_API_AUTH_TOKEN: ${SCORE_EDITOR_API_TOKEN:-}
      ALLOW_UNAUTHENTICATED_LLM_PROXY: ${ALLOW_UNAUTHENTICATED_LLM_PROXY:-0}
      NEXT_PUBLIC_SCORE_EDITOR_API_BASE: ${NEXT_PUBLIC_SCORE_EDITOR_API_BASE:-/api/score-editor}
      NEXT_PUBLIC_SOUNDFONT_CDN_URL: ${NEXT_PUBLIC_SOUNDFONT_CDN_URL:-https://cdn.ourtextscores.com/soundfonts/default.sf2}
      # OpenTelemetry pass-through for score editor API runtime (when enabled there)
      OTEL_ENABLED: ${SCORE_EDITOR_OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${SCORE_EDITOR_OTEL_SERVICE_NAME:-ots-web-score-editor-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
    volumes:
      - ../OTS_Web:/app
      - ../NotaGen:/opt/notagen:ro
      - musescore4_opt:/opt/musescore4
    ports:
      - "127.0.0.1:4010:3000"
    networks:
      - appnet

  mongo:
    image: mongo:7
    container_name: ourtextscores_mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - ../mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-ots}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change_me}
    networks:
      - appnet

  meili:
    image: getmeili/meilisearch:v1.7.2
    container_name: ourtextscores_meili
    restart: unless-stopped
    ports:
      - "7700:7700"
    volumes:
      - ../meilisearch_data:/meili_data
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili_master_key}
    networks:
      - appnet

  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: ourtextscores_minio
    restart: unless-stopped
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - ../minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    networks:
      - appnet

  mailpit:
    image: axllent/mailpit:latest
    container_name: ourtextscores_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"  # web UI
      - "1025:1025"  # SMTP
    networks:
      - appnet

  # Multitrack MusicVAE — self-hosted CPU service (Magenta MusicVAE via FastAPI).
  # score_editor_api reaches it as http://musicvae:7860 (MUSIC_MULTITRACK_VAE_SERVICE_URL).
  # Dev builds from the sibling repo; in prod swap `build:` for a pushed image, e.g.
  #   image: ghcr.io/ourtextscores/musicvae:latest
  musicvae:
    build: ./musicvae
    container_name: ourtextscores_musicvae
    restart: unless-stopped
    environment:
      MUSIC_MULTITRACK_VAE_CKPT_DIR: /data/checkpoints
    volumes:
      - musicvae_checkpoints:/data/checkpoints
    networks:
      - appnet
    mem_limit: 6g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7860/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  # Persists the extracted MuseScore 4 across score_editor_api recreates so the
  # 172 MB AppImage is downloaded/extracted only once.
  musescore4_opt:
  # Persists the ~1 GB MusicVAE checkpoints across musicvae recreates.
  musicvae_checkpoints:

networks:
  appnet:
    driver: bridge
